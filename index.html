<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151d">
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
<title>SYSTEMATIC DEBUGGER</title>
<style>
:root{color-scheme:dark;--bg:#0d1219;--panel:#151d28;--panel2:#1b2633;--line:#2a3747;--text:#e8edf4;--muted:#91a0b2;--gold:#d6ad55;--blue:#6fa8dc;--green:#55c49a;--red:#e47777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:#101720;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{width:36px;height:36px;border:1px solid #8e7138;border-radius:10px;display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:18px}.brand-name{font-weight:800;letter-spacing:1.5px;font-size:13px}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2px}
.nav-label{font-size:10px;color:#647386;letter-spacing:1.5px;padding:0 10px;margin-bottom:7px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab6c5;text-align:left;padding:11px 12px;border-radius:8px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#202c3a;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--gold)}.nav .ico{width:18px;text-align:center;color:var(--gold)}
.side-bottom{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:#141d28}.side-bottom small{color:var(--muted)}.sync-line{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}.dot.pending{background:var(--gold)}
main{min-width:0}.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(13,18,25,.85)}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.status{font-size:11px;color:var(--green);border:1px solid #285642;padding:5px 9px;border-radius:20px}.avatar{width:30px;height:30px;border-radius:50%;background:#28384b;color:var(--gold);display:grid;place-items:center;font-weight:700}
.content{padding:30px;max-width:1440px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:700}.page-head h1{font-size:25px;margin:5px 0 4px;letter-spacing:.2px}.sub{color:var(--muted);margin:0;font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 13px;font-size:12px}.btn:hover{border-color:#65788d}.btn.primary{background:var(--gold);border-color:var(--gold);color:#171717;font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}
.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.stat-label{color:var(--muted);font-size:11px}.stat-value{font-size:27px;font-weight:750;margin-top:8px}.stat-note{font-size:10px;color:#728297;margin-top:3px}
.two-col{grid-template-columns:minmax(0,1.5fr) minmax(260px,.85fr)}.card-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.card-title h2{font-size:13px;margin:0}.card-title span{font-size:10px;color:var(--muted)}
.project-list{display:grid;gap:9px}.project{border:1px solid var(--line);border-radius:9px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#17212c}.project:hover{border-color:#66788b}.project-main{min-width:0}.project-name{font-weight:650;font-size:13px}.project-meta{font-size:10px;color:var(--muted);margin-top:4px}.tag{font-size:9px;border:1px solid #394a5c;color:#aebdcd;padding:4px 7px;border-radius:20px;white-space:nowrap}.tag.active{color:var(--green);border-color:#285642}.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed #344354;border-radius:9px}.empty strong{display:block;color:var(--text);margin-bottom:5px}
.activity{display:grid;gap:14px}.activity-item{display:flex;gap:10px;font-size:11px;color:var(--muted)}.activity-icon{width:25px;height:25px;border-radius:7px;background:#243243;display:grid;place-items:center;color:var(--gold);flex:none}.activity-item strong{display:block;color:var(--text);font-weight:600}.phase-list{display:grid;gap:10px}.phase{display:flex;align-items:center;gap:11px}.phase-num{width:27px;height:27px;border-radius:8px;background:#243243;color:var(--gold);display:grid;place-items:center;font-size:11px}.phase strong{font-size:11px;display:block}.phase small{color:var(--muted);font-size:10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px}th{color:var(--muted);font-weight:600;background:#18222e}td{color:#d3dce7}tr:last-child td{border-bottom:0}
.form-grid{display:grid;gap:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0f1721;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;outline:none}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.show{display:flex}.modal{width:min(500px,100%);background:#17212c;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 70px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{font-size:16px;margin:0}.close{background:none;border:0;color:var(--muted);font-size:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.notice{border:1px solid #66532d;background:#292317;color:#d8c18d;border-radius:9px;padding:11px 13px;font-size:11px;margin-bottom:15px}.muted{color:var(--muted)}.section-gap{margin-top:17px}.hidden{display:none!important}
.mobile-menu{display:none}
/* Code Viewer */
.code-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;min-height:520px}.code-sidebar{background:#111a25;border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.code-main{min-width:0;display:grid;grid-template-rows:auto minmax(330px,1fr) auto;gap:10px}.file-list{display:grid;gap:5px;margin-top:12px}.file-item{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:8px;border:1px solid transparent;border-radius:7px;color:#cbd5e1;font-size:11px;cursor:pointer;min-width:0}.file-item.active,.file-item:hover{background:#202c3a;border-color:#35485c}.file-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editor-shell{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b1119;display:grid;grid-template-rows:auto 1fr;min-height:340px}.editor-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#172230;border-bottom:1px solid var(--line);gap:8px}.editor-area{
  display:grid;
  grid-template-columns:42px minmax(0,1fr);
  min-height:300px;
}

.line-numbers{
  padding:12px 8px;
  text-align:right;
  color:#607086;
  background:#0e1620;
  font:12px/1.65 ui-monospace,monospace;
  white-space:pre;
  overflow:hidden;
  user-select:none;
}

.editor-content{
  position:relative;
  min-width:0;
  min-height:300px;
  overflow:hidden;
}

.editor-content pre,
.editor-content textarea{
  box-sizing:border-box;
  width:100%;
  min-height:300px;
  margin:0;
  padding:12px;
  border:0;
  font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;
  tab-size:2;
  white-space:pre;
  overflow:auto;
}

.editor-content pre{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:#0d1621;
}

.editor-content code{
  font:inherit;
  text-shadow:none;
}

.code-input{
  position:relative;
  display:block;
  resize:vertical;
  outline:none;
  background:transparent;
  color:transparent;
  caret-color:#ffffff;
  -webkit-text-fill-color:transparent;
  z-index:1;
}

.code-input::selection{
  background:rgba(90,150,230,.35);
}

.error-line{
  background:rgba(228,119,119,.18);
  border-left:3px solid var(--red);
}
  
.error-code-highlight{
  background:rgba(228,119,119,.20);
  display:block;
  width:100%;
}


.error-line-label{
  color:var(--red);
  font-weight:bold;
}

.code-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.code-panel{border:1px solid var(--line);border-radius:9px;padding:12px;background:#121b26;min-width:0}.code-panel h3{font-size:11px;margin:0 0 8px}.code-panel textarea{width:100%;min-height:95px;background:#0c141e;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px;font:11px/1.5 ui-monospace,monospace}.code-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.code-toolbar input{max-width:220px;background:#0f1721;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px}.code-status{font-size:10px;color:var(--muted)}
@media(max-width:760px){.code-layout{grid-template-columns:1fr}.code-sidebar{order:2}.code-main{order:1}.code-bottom{grid-template-columns:1fr}.editor-area{grid-template-columns:32px minmax(0,1fr)}.code-input{font-size:11px}}
@media(max-width:900px){.app{grid-template-columns:205px 1fr}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;z-index:4;left:-260px;top:0;bottom:0;width:248px;transition:left .2s;box-shadow:10px 0 40px #0008}.sidebar.open{left:0}.topbar{height:58px;padding:0 15px}.mobile-menu{display:inline-block}.content{padding:20px 15px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:22px}.stats{gap:9px}.card{padding:13px}.stat-value{font-size:23px}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">SD</div><div><div class="brand-name">SYSTEMATIC DEBUGGER</div><div class="brand-sub">ROOT CAUSE ANALYSIS</div></div></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">◫</span>Dashboard</button>
    <button data-page="projects"><span class="ico">▤</span>Projects</button>
    <button data-page="investigation"><span class="ico">⌕</span>Investigation</button>
    <button data-page="hypotheses"><span class="ico">◇</span>Hypotheses</button>
    <button data-page="verification"><span class="ico">✓</span>Verification</button>
    <button data-page="history"><span class="ico">◷</span>History</button>
    <button data-page="code"><span class="ico">⌘</span>Code Viewer</button>
  </nav></div>
  <div><div class="nav-label">SYSTEM</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav></div>
  <div class="side-bottom"><small>STORAGE STATUS</small><div class="sync-line"><span class="dot"></span> Local storage active</div><div class="sync-line"><span class="dot pending"></span> Cloud sync not configured</div></div>
</aside>
<main>
<header class="topbar"><div class="crumb"><button class="btn ghost mobile-menu" id="menuBtn">☰</button> WORKSPACE　/　<strong id="crumb">Dashboard</strong></div><div class="top-actions"><span class="status">● SYSTEM READY</span><div class="avatar">SD</div></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><h2>新規プロジェクト</h2><button class="close" id="closeModal">×</button></div>
    <form id="projectForm" class="form-grid">
      <div class="field"><label for="projectName">プロジェクト名 *</label><input id="projectName" required maxlength="70" placeholder="例：BINARY SECRET"></div>
      <div class="field"><label for="projectDesc">説明</label><textarea id="projectDesc" placeholder="プロジェクトの概要・使用技術など"></textarea></div>
      <div class="field"><label for="projectStatus">ステータス</label><select id="projectStatus"><option>進行中</option><option>計画中</option><option>完了</option></select></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:5px"><button type="button" class="btn" id="cancelModal">キャンセル</button><button class="btn primary" type="submit">作成する</button></div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.15.0/acorn.min.js"></script>

<script>  
const KEY='systematicDebugger.v1';
const initial={projects:[],activities:[],issues:[],hypotheses:[],checks:[]};
let state=loadState(),currentPage='dashboard',selectedProject=null;
function loadState(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...initial}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(v){return new Date(v).toLocaleDateString('ja-JP',{year:'numeric',month:'short',day:'numeric'})}
function log(message){state.activities.unshift({message,at:new Date().toISOString()});state.activities=state.activities.slice(0,30);save()}
function projectCard(p){return `<div class="project"><div class="project-main"><div class="project-name">${esc(p.name)}</div><div class="project-meta">${esc(p.description||'説明なし')} · 更新 ${dateLabel(p.updatedAt)}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="tag ${p.status==='進行中'?'active':''}">${esc(p.status)}</span><button class="btn" onclick="openProject('${p.id}')">開く</button></div></div>`}
function pageHead(kicker,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function render(){
 const v=document.getElementById('view');document.getElementById('crumb').textContent=({dashboard:'Dashboard',projects:'Projects',investigation:'Investigation',hypotheses:'Hypotheses',verification:'Verification',history:'History',code:'Code Viewer',settings:'Settings'})[currentPage]||'Project';
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
 if(currentPage==='dashboard')v.innerHTML=dashboard();
 if(currentPage==='projects')v.innerHTML=projectsPage();
 if(currentPage==='investigation')v.innerHTML=investigationPage();
 if(currentPage==='hypotheses')v.innerHTML=hypothesesPage();
 if(currentPage==='verification')v.innerHTML=verificationPage();
 if(currentPage==='history')v.innerHTML=historyPage();
 if(currentPage==='code')v.innerHTML=codePage();
 if(currentPage==='settings')v.innerHTML=settingsPage();

 if(currentPage==='code'){
   updateLineNumbers();
   syncLineScroll();
 }
}
function dashboard(){
 const active=state.projects.filter(p=>p.status==='進行中').length;
 return `${pageHead('OVERVIEW / SYSTEM STATUS','Dashboard','プロジェクトとデバッグ作業の全体状況を確認します。',`<button class="btn primary" onclick="showModal()">＋ 新規プロジェクト</button>`)}
 <div class="grid stats">
 <div class="card"><div class="stat-label">TOTAL PROJECTS</div><div class="stat-value">${state.projects.length}</div><div class="stat-note">登録済みプロジェクト</div></div>
 <div class="card"><div class="stat-label">ACTIVE PROJECTS</div><div class="stat-value">${active}</div><div class="stat-note">現在進行中</div></div>
 <div class="card"><div class="stat-label">OPEN INVESTIGATIONS</div><div class="stat-value">${state.issues.filter(x=>x.status!=='解決').length}</div><div class="stat-note">未解決の調査</div></div>
 <div class="card"><div class="stat-label">HYPOTHESES</div><div class="stat-value">${state.hypotheses.length}</div><div class="stat-note">登録された原因仮説</div></div></div>
 <div class="grid two-col"><section class="card"><div class="card-title"><h2>PROJECT OVERVIEW</h2><button class="btn" onclick="navigate('projects')">すべて表示 →</button></div><div class="project-list">${state.projects.length?state.projects.slice(0,5).map(projectCard).join(''):`<div class="empty"><strong>プロジェクトがありません</strong>最初のプロジェクトを作成してください。<br><br><button class="btn primary" onclick="showModal()">＋ プロジェクト作成</button></div>`}</div></section>
 <section class="card"><div class="card-title"><h2>DEBUGGING WORKFLOW</h2><span>4 PHASES</span></div><div class="phase-list">
 ${[['01','ROOT CAUSE INVESTIGATION','症状・再現条件・証拠の収集'],['02','PATTERN ANALYSIS','正常系と異常系の比較'],['03','HYPOTHESIS & TESTING','原因候補の検証'],['04','IMPLEMENTATION','修正と回帰テスト']].map(x=>`<div class="phase"><div class="phase-num">${x[0]}</div><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div></section></div>
 <section class="card section-gap"><div class="card-title"><h2>RECENT ACTIVITY</h2><button class="btn" onclick="navigate('history')">履歴を見る →</button></div>${activityMarkup(5)}</section>`;
}
function projectsPage(){return `${pageHead('WORKSPACE / PROJECTS','Projects','開発プロジェクトを作成・管理します。',`<button class="btn primary" onclick="showModal()">＋ 新規プロジェクト</button>`)}<div class="project-list">${state.projects.length?state.projects.map(projectCard).join(''):`<div class="empty"><strong>プロジェクトがありません</strong>新規プロジェクトから作成できます。</div>`}</div>`}
function investigationPage(){return `${pageHead('PHASE 01 / INVESTIGATION','Investigation','修正を始める前に、症状・再現条件・証拠を整理します。')}<div class="notice">調査フェーズでは、原因が確認できるまでコードを変更しないでください。</div><div class="card"><form id="issueForm" class="form-grid"><div class="field"><label>対象プロジェクト *</label><select name="project" required>${projectOptions()}</select></div><div class="field"><label>問題のタイトル *</label><input name="title" required placeholder="例：暗号化ボタンを押しても反応しない"></div><div class="field"><label>期待する動作</label><textarea name="expected" placeholder="本来どのように動作するべきか"></textarea></div><div class="field"><label>実際の動作・エラー</label><textarea name="actual" placeholder="実際に起きていること、エラーメッセージ"></textarea></div><div class="field"><label>再現手順・条件</label><textarea name="steps" placeholder="1. ページを開く&#10;2. 入力欄に文字を入力&#10;3. ボタンを押す"></textarea></div><div class="field"><label>関連コード・ログ（任意）</label><textarea name="code" placeholder="関連するコードやログを貼り付け"></textarea></div><button class="btn primary" type="submit">調査記録を保存</button></form></div><section class="card section-gap"><div class="card-title"><h2>INVESTIGATION RECORDS</h2><span>${state.issues.length} RECORDS</span></div>${state.issues.length?`<div class="table-wrap"><table><thead><tr><th>問題</th><th>プロジェクト</th><th>状態</th><th>登録日</th></tr></thead><tbody>${state.issues.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(projectName(i.project))}</td><td>${esc(i.status)}</td><td>${dateLabel(i.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">調査記録はまだありません。</div>`}</section>`}

function lineNumberText(v=''){return Array.from({length:Math.max(1,String(v).split('\n').length)},(_,i)=>i+1).join('\n')}
function languageLabel(n){const e=(n.split('.').pop()||'text').toLowerCase();return ({js:'JS',mjs:'JS',html:'HTML',htm:'HTML',css:'CSS',json:'JSON',md:'MD'})[e]||'TEXT'}
function newCodeFile(){ensureCodeFiles();const name=prompt('ファイル名を入力してください（例：app.js）');if(!name)return;if(!/^[a-zA-Z0-9._-]+$/.test(name)){alert('ファイル名は英数字・ドット・ハイフン・アンダースコアで入力してください。');return}if(state.codeFiles.some(x=>x.name===name)){alert('同じ名前のファイルがあります。');return}const f={id:crypto.randomUUID(),name,content:'',original:'',updatedAt:new Date().toISOString()};state.codeFiles.push(f);activeCodeId=f.id;log(`コードファイル「${name}」を作成`);save();render()}
function selectCodeFile(id){activeCodeId=id;render()}
function uploadCodeFiles(files){if(!files?.length)return;ensureCodeFiles();const allowed=/\.(html?|css|m?js|json|txt|md)$/i;let pending=files.length;Array.from(files).forEach(file=>{if(!allowed.test(file.name)){alert(`${file.name}: 対応していない拡張子です。`);if(!--pending)finish();return}const reader=new FileReader();reader.onload=()=>{const old=state.codeFiles.find(x=>x.name===file.name);if(old){if(!confirm(`${file.name} は既にあります。置き換えますか？`)){if(!--pending)finish();return}old.content=String(reader.result);old.original=String(reader.result);old.updatedAt=new Date().toISOString();activeCodeId=old.id}else{const f={id:crypto.randomUUID(),name:file.name,content:String(reader.result),original:String(reader.result),updatedAt:new Date().toISOString()};state.codeFiles.push(f);activeCodeId=f.id}if(!--pending)finish()};reader.onerror=()=>{alert(`${file.name}を読み込めませんでした。`);if(!--pending)finish()}});function finish(){log('コードファイルを取り込み');save();render()}}

function saveCodeFile(){
  const f=state.codeFiles.find(x=>x.id===activeCodeId);

  if(!f){
    alert('保存するファイルが選択されていません。');
    return;
  }

  const editor=document.getElementById('codeEditor');

  if(!editor){
    alert('エディタが見つかりません。');
    return;
  }

  const oldContent=f.content;

  try{
    f.content=editor.value;
    f.updatedAt=new Date().toISOString();

    state.activities.unshift({
      message:`コードファイル「${f.name}」を保存`,
      at:new Date().toISOString()
    });

    state.activities=state.activities.slice(0,30);

    save();

    alert('コードを保存しました。');
    render();

  }catch(error){
    f.content=oldContent;

    alert(
      '保存に失敗しました。\n\n' +
      '原因：' + error.message
    );
  }
}
function downloadCodeFile(){const f=state.codeFiles.find(x=>x.id===activeCodeId);if(!f)return;const text=document.getElementById('codeEditor').value;const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function deleteCodeFile(){const f=state.codeFiles.find(x=>x.id===activeCodeId);if(!f||!confirm(`${f.name} を削除しますか？`))return;state.codeFiles=state.codeFiles.filter(x=>x.id!==activeCodeId);activeCodeId=state.codeFiles[0]?.id||null;log(`コードファイル「${f.name}」を削除`);save();render()}
let detectedErrorLine=null;
let pendingFixCode=null;
let originalFixCode=null;
let undoFixCode=null;
function updateLineNumbers(){
  const editor=document.getElementById('codeEditor');
  const numbers=document.getElementById('lineNumbers');

  if(editor&&numbers){
    const totalLines=editor.value.split('\n').length;

    let html='';

    for(let i=1;i<=totalLines;i++){
      if(i===detectedErrorLine){
        html+='<div class="error-line-label">! '+i+'</div>';
      }else{
        html+='<div>'+i+'</div>';
      }
    }

    numbers.innerHTML=html;
  }

  updateHighlight();
}

function updateHighlight(){
  const editor=document.getElementById('codeEditor');
  const output=document.getElementById('highlightedCode');

  if(!editor||!output||!window.Prism)return;

  const file=state.codeFiles.find(f=>f.id===activeCodeId);
  const name=file?.name||'';
  const ext=name.split('.').pop().toLowerCase();

  const languages={
    js:'javascript',
    mjs:'javascript',
    html:'markup',
    htm:'markup',
    css:'css',
    json:'json'
  };

  const language=languages[ext]||'javascript';
  const grammar=Prism.languages[language];

  const code=editor.value;
  const lines=code.split('\n');

  output.className='language-'+language;

  const highlighted=grammar
    ? Prism.highlight(code,grammar,language)
    : Prism.util.encode(code);

  const highlightedLines=highlighted.split('\n');

  output.innerHTML=highlightedLines.map((line,index)=>{
    const lineNumber=index+1;

    if(lineNumber===detectedErrorLine){
      return '<span class="error-code-highlight">'+
        (line||' ')+'</span>';
    }

    return '<span>'+ (line||' ')+'</span>';
  }).join('\n');

  output.parentElement.className='language-'+language;
}
function syncLineScroll(){
  const editor=document.getElementById('codeEditor');
  const numbers=document.getElementById('lineNumbers');
  const highlight=document.querySelector('.editor-content pre');

  if(editor&&numbers){
    numbers.scrollTop=editor.scrollTop;
  }

  

  if(editor&&highlight){
    highlight.scrollTop=editor.scrollTop;
    highlight.scrollLeft=editor.scrollLeft;
  }
}

function jumpToErrorLine(){
  const editor=document.getElementById('codeEditor');

  if(!editor||!detectedErrorLine)return;

  const lines=editor.value.split('\n');

  let position=0;

  for(let i=0;i<detectedErrorLine-1;i++){
    position+=lines[i].length+1;
  }

  editor.focus();
  editor.setSelectionRange(
    position,
    position+lines[detectedErrorLine-1].length
  );

  const lineHeight=parseFloat(
    getComputedStyle(editor).lineHeight
  );

  editor.scrollTop=(detectedErrorLine-1)*lineHeight;
}
  
function undoAppliedFix(){
  const editor=document.getElementById('codeEditor');
  const status=document.getElementById('fixStatus');

  if(!editor||undoFixCode===null){
    status.textContent='取り消せる修正がありません。';
    return;
  }

  editor.value=undoFixCode;
  undoFixCode=null;

  updateLineNumbers();
  updateHighlight();

  status.textContent='修正を取り消しました。保存ボタンで元のコードを保存できます。';
}

function applyFixPreview(){
  const editor=document.getElementById('codeEditor');
  const status=document.getElementById('fixStatus');

  if(!editor||pendingFixCode===null)return;

  if(editor.value!==originalFixCode){
    status.textContent='元のコードが変更されています。再検査してください。';
    return;
  }

  try{
    acorn.parse(pendingFixCode,{
      ecmaVersion:'latest',
      sourceType:'script'
    });
  }catch(error){
    status.textContent='修正候補の再検査に失敗しました。';
    return;
  }
  undoFixCode=editor.value;
  editor.value=pendingFixCode;

  pendingFixCode=null;
  originalFixCode=null;

  updateLineNumbers();
  updateHighlight();

  document.getElementById('fixBefore').textContent='---';
  document.getElementById('fixAfter').textContent='---';
  document.getElementById('applyFixButton').disabled=true;

  status.textContent='修正を適用しました。保存ボタンでファイルに保存してください。';
}

function cancelFixPreview(){
  pendingFixCode=null;
  originalFixCode=null;

  document.getElementById('fixBefore').textContent='---';
  document.getElementById('fixAfter').textContent='---';
  document.getElementById('fixStatus').textContent='修正候補をキャンセルしました。';
  document.getElementById('applyFixButton').disabled=true;
}
function createFixPreview(error,code){
  const before=document.getElementById('fixBefore');
  const after=document.getElementById('fixAfter');
  const status=document.getElementById('fixStatus');
  const button=document.getElementById('applyFixButton');

  pendingFixCode=null;
  originalFixCode=null;

  before.textContent=code;
  after.textContent='修正候補はありません。';
  button.disabled=true;

  if(!error.loc||!error.message.includes('Unexpected token')){
    status.textContent='安全に修正できる候補がありません。';
    return;
  }

  const lines=code.split('\n');
  const index=error.loc.line-1;
  const line=lines[index];

  const match=line.match(/^(\s*console\.log\([^;\n]*)(;)(\s*)$/);

  if(!match)return;

  const openCount=(match[1].match(/\(/g)||[]).length;
  const closeCount=(match[1].match(/\)/g)||[]).length;

  if(openCount-closeCount!==1)return;

  lines[index]=match[1]+')'+match[2]+match[3];

  const fixedCode=lines.join('\n');

  try{
    acorn.parse(fixedCode,{
      ecmaVersion:'latest',
      sourceType:'script'
    });
  }catch(error){
    return;
  }

  originalFixCode=code;
  pendingFixCode=fixedCode;

  after.textContent=fixedCode;
  status.textContent='修正候補を生成しました。内容を確認してください。';
  button.disabled=false;
}
function analyzeCodeError(error,code){
  const analysis=document.getElementById('errorAnalysis');
  const suggestion=document.getElementById('errorSuggestion');

  if(!analysis||!suggestion)return;

  const message=error.message;

  let cause='エラーの原因を特定できませんでした。コードを確認してください。';
  let fix='エラー箇所の前後のコードを確認してください。';

  if(message.includes('Unexpected token')){
    cause='予期しない記号が見つかりました。括弧や記号の対応関係に問題がある可能性があります。';
    fix='()、{}、[] の閉じ忘れや、余分な記号がないか確認してください。';
  }
  else if(message.includes('Unterminated string')){
    cause='文字列が正しく閉じられていません。';
    fix='文字列の開始と終了に対応する引用符（" または \') があるか確認してください。';
  }
  else if(message.includes('Unterminated comment')){
    cause='コメントが正しく閉じられていません。';
    fix='/* で始めたコメントに */ があるか確認してください。';
  }
  else if(message.includes('Identifier')){
    cause='変数名や識別子の宣言に問題がある可能性があります。';
    fix='変数名の重複や、宣言の書き方を確認してください。';
  }

  analysis.textContent='原因分析：'+cause;
  suggestion.textContent='修正候補：'+fix;
}

  function detectCodeErrors(){
  const editor=document.getElementById('codeEditor');
  const results=document.getElementById('errorResults');
  const status=document.getElementById('errorStatus');

  if(!editor||!results||!status)return;

  const code=editor.value;
  const file=state.codeFiles.find(x=>x.id===activeCodeId);

  if(!file){
    status.textContent='ファイル未選択';
    results.textContent='先にファイルを作成してください。';
    return;
  }

  if(!code.trim()){
    status.textContent='検査対象なし';
    results.textContent='コードが入力されていません。';
    return;
  }

  if(!/\.(js|mjs)$/i.test(file.name)){
    status.textContent='対象外';
    results.textContent='現在はJavaScript（.js / .mjs）のみ検査できます。';
    return;
  }

  if(!window.acorn){
    status.textContent='検査できません';
    results.textContent='Acornの読み込みに失敗しました。ページを再読み込みしてください。';
    return;
  }

  try{
    acorn.parse(code,{
      ecmaVersion:'latest',
      sourceType:'script'
    });

    status.textContent='検査完了';
    status.style.color='var(--green)';
    results.textContent='構文エラーは見つかりませんでした。';
    document.getElementById('errorAnalysis').textContent='原因分析：構文エラーは見つかりませんでした。';
document.getElementById('errorSuggestion').textContent='修正候補：必要ありません。';

    detectedErrorLine=null;
updateLineNumbers();

  }catch(error){
    status.textContent='エラー検出';
    status.style.color='var(--red)';

    const line=error.loc?error.loc.line:'特定できません';
    const column=error.loc?error.loc.column+1:'特定できません';
    detectedErrorLine=error.loc?error.loc.line:null;
    updateLineNumbers();


    results.textContent=
      'エラー内容：'+error.message+
      '\n行番号：'+line+
      '\n列番号：'+column;

    results.style.whiteSpace='pre-wrap';
    analyzeCodeError(error,code);
    createFixPreview(error,code);

  }
}
function searchCode(){const q=document.getElementById('codeSearch')?.value||'',v=document.getElementById('codeEditor')?.value||'',out=document.getElementById('searchResults');if(!out)return;if(!q){out.textContent='検索語を入力すると、このファイル内を検索します。';return}const hits=v.split('\n').map((line,i)=>({line:i+1,text:line})).filter(x=>x.text.toLowerCase().includes(q.toLowerCase()));out.textContent=hits.length?hits.slice(0,30).map(x=>`L${x.line}: ${x.text.trim()}`).join('\n'):`「${q}」は見つかりませんでした。`;out.style.whiteSpace='pre-wrap'}
function previewCodeDiff(){const f=state.codeFiles.find(x=>x.id===activeCodeId);if(!f)return;const now=document.getElementById('codeEditor').value,old=f.content||'';const a=old.split('\n'),b=now.split('\n');let changes=0;for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i])changes++;document.getElementById('diffInfo').textContent=`保存済み ${a.length} 行 / 編集中 ${b.length} 行 / 異なる行位置 ${changes} 箇所（簡易比較）`}

function historyPage(){return `${pageHead('SYSTEM / ACTIVITY LOG','History','プロジェクトとデバッグ作業の履歴です。')}<section class="card">${activityMarkup(30)}</section>`}
function settingsPage(){return `${pageHead('SYSTEM / CONFIGURATION','Settings','保存方式とシステム情報を確認します。')}<div class="grid two-col"><section class="card"><div class="card-title"><h2>STORAGE CONFIGURATION</h2><span>LOCAL-FIRST</span></div><p>現在のバージョンでは、このブラウザのLocalStorageにデータを保存します。</p><div class="notice">クラウド同期は将来の接続用として設計されています。現時点ではクラウドへの送信・同期は行いません。</div><p class="muted">保存キー：${KEY}</p><button class="btn" onclick="exportData()">データをJSONでエクスポート</button> <button class="btn" onclick="document.getElementById('importFile').click()">JSONをインポート</button><input id="importFile" type="file" accept="application/json" class="hidden"></section><section class="card"><div class="card-title"><h2>AI CONFIGURATION</h2><span class="tag">NOT CONNECTED</span></div><p>AI分析エンジンは後続フェーズで実装します。</p><p class="muted">現在は手動で調査・仮説・検証を記録できます。APIキーはまだ必要ありません。</p></section></div><section class="card section-gap"><div class="card-title"><h2>DANGER ZONE</h2></div><p class="muted">すべてのローカルデータを削除します。この操作は取り消せません。</p><button class="btn danger" onclick="clearData()">ローカルデータを削除</button></section>`}
function activityMarkup(n){return state.activities.length?`<div class="activity">${state.activities.slice(0,n).map(a=>`<div class="activity-item"><div class="activity-icon">↳</div><div><strong>${esc(a.message)}</strong>${dateLabel(a.at)}</div></div>`).join('')}</div>`:`<div class="empty">アクティビティはまだありません。</div>`}
function projectOptions(){return state.projects.length?state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):`<option value="">先にプロジェクトを作成してください</option>`}
function projectName(id){return state.projects.find(p=>p.id===id)?.name||'削除済みプロジェクト'}
function navigate(page){currentPage=page;selectedProject=null;render();document.getElementById('sidebar').classList.remove('open')}
function showModal(){document.getElementById('modal').classList.add('show');document.getElementById('projectName').focus()}
function hideModal(){document.getElementById('modal').classList.remove('show')}
function openProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;selectedProject=id;document.getElementById('crumb').textContent=p.name;document.getElementById('view').innerHTML=`${pageHead('PROJECT / DETAIL',esc(p.name),esc(p.description||'説明は登録されていません。'),"<button class=\"btn\" onclick=\"navigate('projects')\">← Projectsへ戻る</button>")}<div class="grid stats"><div class="card"><div class="stat-label">INVESTIGATIONS</div><div class="stat-value">${state.issues.filter(x=>x.project===id).length}</div></div><div class="card"><div class="stat-label">HYPOTHESES</div><div class="stat-value">${state.hypotheses.filter(x=>x.project===id).length}</div></div><div class="card"><div class="stat-label">TESTS</div><div class="stat-value">${state.checks.filter(x=>x.project===id).length}</div></div><div class="card"><div class="stat-label">STATUS</div><div class="stat-value" style="font-size:17px">${esc(p.status)}</div></div></div><section class="card"><div class="card-title"><h2>PROJECT INFORMATION</h2><span>CREATED ${dateLabel(p.createdAt)}</span></div><p>${esc(p.description||'説明なし')}</p><div class="toolbar"><button class="btn" onclick="navigate('investigation')">＋ 調査を追加</button><button class="btn" onclick="navigate('hypotheses')">＋ 仮説を追加</button><button class="btn" onclick="navigate('verification')">＋ 検証を追加</button><button class="btn danger" onclick="deleteProject('${id}')">プロジェクト削除</button></div></section>`}
function deleteProject(id){if(!confirm('このプロジェクトと関連する調査・仮説・検証記録を削除しますか？'))return;state.projects=state.projects.filter(p=>p.id!==id);state.issues=state.issues.filter(x=>x.project!==id);state.hypotheses=state.hypotheses.filter(x=>x.project!==id);state.checks=state.checks.filter(x=>x.project!==id);log('プロジェクトを削除');save();navigate('projects')}
function updateHyp(id,result){const h=state.hypotheses.find(x=>x.id===id);if(h){h.result=result;log(`仮説「${h.title}」を${result}に更新`);save()}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='systematic-debugger-backup.json';a.click();URL.revokeObjectURL(a.href)}
function clearData(){if(!confirm('本当にすべてのローカルデータを削除しますか？'))return;localStorage.removeItem(KEY);state={...initial};render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('closeModal').addEventListener('click',hideModal);document.getElementById('cancelModal').addEventListener('click',hideModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});
document.getElementById('projectForm').addEventListener('submit',e=>{e.preventDefault();const p={id:crypto.randomUUID(),name:document.getElementById('projectName').value.trim(),description:document.getElementById('projectDesc').value.trim(),status:document.getElementById('projectStatus').value,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(!p.name)return;state.projects.unshift(p);log(`プロジェクト「${p.name}」を作成`);save();e.target.reset();hideModal();navigate('projects')});
document.getElementById('view').addEventListener('submit',e=>{if(e.target.id==='issueForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.project){alert('先にプロジェクトを作成してください。');return}state.issues.unshift({...d,id:crypto.randomUUID(),status:'未解決',createdAt:new Date().toISOString()});log(`調査「${d.title}」を登録`);save();render()}if(e.target.id==='hypForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.project){alert('先にプロジェクトを作成してください。');return}state.hypotheses.unshift({...d,id:crypto.randomUUID(),result:'未検証',createdAt:new Date().toISOString()});log(`仮説「${d.title}」を登録`);save();render()}if(e.target.id==='checkForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.project){alert('先にプロジェクトを作成してください。');return}state.checks.unshift({...d,id:crypto.randomUUID(),createdAt:new Date().toISOString()});log(`テスト「${d.title}」を登録`);save();render()}});
document.getElementById('view').addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projects||!d.activities)throw Error();state={...initial,...d};save();render();alert('データをインポートしました。')}catch(err){alert('JSONファイルを読み込めませんでした。')}};r.readAsText(e.target.files[0])}});
render();
</script>
  

</body>
